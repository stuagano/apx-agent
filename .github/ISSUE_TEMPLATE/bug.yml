name: Bug
description: Confirmed defect or regression.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Include exact files, lines, commands, logs, or failing tests.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal steps or command sequence that demonstrates the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: proposed_fix
    attributes:
      label: Smallest Proposed Fix
      description: The narrowest change that should resolve the issue.
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Tests or read-after-write checks that should prove the fix.
    validations:
      required: false
