name: builder-ui

on:
  pull_request:
    paths:
      - 'python/builder-ui/**'
      - '.github/workflows/builder-ui.yml'
  push:
    branches: [main]
    paths:
      - 'python/builder-ui/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/builder-ui

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: python/builder-ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
