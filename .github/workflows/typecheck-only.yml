name: typecheck-only

# Fast-feedback workflow: <30s on cache-hit. Gives PRs a quick yes/no
# before the full test.yml suite finishes.

on:
  push:
  pull_request:

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-import:
    name: Python import sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            python/.venv
          key: uv-${{ runner.os }}-py3.11-${{ hashFiles('python/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.11-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Import apx_agent
        run: uv run python -c "import apx_agent; print('ok')"

  typescript-typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
