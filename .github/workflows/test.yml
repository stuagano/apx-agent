name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref (force-pushes to a PR).
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests (3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache uv environment
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            python/.venv
          key: uv-${{ runner.os }}-py3.11-${{ hashFiles('python/uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-py3.11-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest -q --junitxml=pytest-results.xml
        # NOTE: continue-on-error is false (default). Pre-existing failures
        # surface in the suite — that's the signal we want.

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: python/pytest-results.xml
          if-no-files-found: ignore

  typescript-tests:
    name: TypeScript tests (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=vitest-results.xml
        # NOTE: continue-on-error is false (default). Three pre-existing
        # failures in streaming.test.ts (missing devdeps: light-my-request,
        # express) and evolutionary-durable.test.ts (assertion regressions)
        # are tracked but not silenced — CI red is the signal.

      - name: Upload vitest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: typescript/vitest-results.xml
          if-no-files-found: ignore
