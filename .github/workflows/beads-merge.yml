name: beads merge

# A merged pull request closes every bead id it names, then pushes
# refs/dolt/data. An exempt PR with no bead id is a no-op. An id that is
# already closed is left closed.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: beads-hive
  cancel-in-progress: false

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bd
        run: bash scripts/beads/setup_bd.sh

      - name: Close the referenced beads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEADS_ACTOR: github-actions[bot]
        run: python3 scripts/beads/beads.py close-pr --event "$GITHUB_EVENT_PATH"
