name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # GITHUB_TOKEN auto-merge does not fire `push`. Post-merge-ci.yml dispatches
  # this so the full 3.11 + 3.13 suite still runs after a bot squash.
  workflow_dispatch:

# Cancel superseded runs on the same ref so a new push frees the runners and
# gives faster feedback instead of queueing behind stale in-flight runs.
# (Never cancel pushes to main — only PR/branch runs.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Detect whether the PR touches anything other than docs. The heavy jobs below
  # ALWAYS run (so the required-status-check contexts are always created and
  # conclude success), but skip their real steps on docs-only PRs. This replaces
  # the old `paths-ignore: [docs/**, **.md]` — which skipped the whole workflow
  # and left the required checks "Expected, waiting" forever, blocking docs-only
  # PRs from ever merging.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Push events (to main) carry no PR context — always run full CI.
          if [ -z "$BASE" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # If the diff can't be computed for any reason, fail SAFE: run full CI
          # (code=true) rather than risk skipping real tests on a code change.
          if ! changed=$(git diff --name-only "$BASE" "$HEAD"); then
            echo "git diff failed — defaulting to full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "changed=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"; echo "$changed"
          {
            echo "changed<<EOF"
            printf '%s\n' "$changed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          # "code" = any changed file that is NOT under docs/ and NOT a .md file
          # (mirrors the old paths-ignore globs). grep -v exits 0 when such a
          # line exists; inside `if`, a non-match (docs-only) doesn't trip set -e.
          if echo "$changed" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    runs-on: ubuntu-latest
    # Hard cap: the 3.11 job on #779 sat 5.5h after 97% with no output because this
    # job had no timeout and pytest had no per-test timeout. Green 3.13 is ~4 min.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: python

    steps:
      # Always check out so the per-job working-directory exists even on the
      # docs-only path (where the real steps below are skipped).
      - uses: actions/checkout@v6

      # Real suite: code PRs run 3.11 on a path-aware subset (runtime core +
      # tests mapped from the diff). 3.13 stays in the matrix so the required
      # check `test (3.13)` still exists; the work is deferred to push-to-main
      # / workflow_dispatch. Docs-only still skip-succeeds both versions.
      - name: Install uv
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11')
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true  # cache the uv download/build cache (keyed on uv.lock)

      - name: Set up Python ${{ matrix.python-version }}
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11')
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11')
        run: uv sync --group dev --all-extras  # incl. langgraph/eval/uc/lakebase so their tests run, not skip

      - name: Select pytest paths
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11')
        id: pytest_paths
        # PRs: runtime core + tests mapped from the diff (see pr-pytest-paths.sh).
        # push / workflow_dispatch: full suite.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_PYTEST_CHANGED_FILES: ${{ needs.changes.outputs.changed }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          paths=$(bash ../scripts/pr-pytest-paths.sh)
          echo "Selected pytest paths: $paths"
          echo "paths=$paths" >> "$GITHUB_OUTPUT"
          if echo " $paths " | grep -q ' tests/ ' || echo "$paths" | grep -q test_appkit; then
            echo "need_ts=true" >> "$GITHUB_OUTPUT"
          else
            echo "need_ts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11') && steps.pytest_paths.outputs.need_ts == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Build internal TypeScript runtime
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11') && steps.pytest_paths.outputs.need_ts == 'true'
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Run tests
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || matrix.python-version == '3.11')
        # paths is an intentionally space-separated list from the selector.
        run: uv run pytest ${{ steps.pytest_paths.outputs.paths }} -n auto --tb=short --timeout=90 --timeout-method=thread

      - name: Docs-only change — tests not required
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only PR — skipping tests; required check passes."

      - name: PR — 3.13 suite deferred to main
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request' && matrix.python-version == '3.13'
        run: echo "PR — 3.13 suite deferred to main; required check passes."

  typecheck:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python

    steps:
      # Always check out so the per-job working-directory exists even on the
      # docs-only path (where the real steps below are skipped).
      - uses: actions/checkout@v6

      - name: Guard uv.lock registry
        if: needs.changes.outputs.code == 'true'
        run: bash ../scripts/check-uv-lock-registry.sh

      - name: Install uv
        if: needs.changes.outputs.code == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true  # cache the uv download/build cache (keyed on uv.lock)

      - name: Set up Python
        if: needs.changes.outputs.code == 'true'
        run: uv python install 3.11

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: uv sync --group dev

      # Gates new type errors. Pre-existing offenders are excluded via the
      # shrinking type-debt registry in pyproject.toml [tool.pyright].
      - name: Run pyright
        if: needs.changes.outputs.code == 'true'
        run: uv run pyright src/apx_agent/

      - name: Docs-only change — pyright not required
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only PR — skipping pyright; required check passes."

  typecheck-ts:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: ['22']
    defaults:
      run:
        working-directory: typescript

    steps:
      # Always check out so the per-job working-directory exists even on the
      # docs-only path (where the real steps below are skipped).
      - uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Guard lockfile registry
        if: needs.changes.outputs.code == 'true'
        run: bash ../scripts/check-ts-lockfile-registry.sh

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: npm ci

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: npm run build

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: npm run typecheck

      - name: Run tests
        if: needs.changes.outputs.code == 'true'
        run: npm test

      - name: Docs-only change — TS checks not required
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only PR — skipping TS build/typecheck/tests; required check passes."
