name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# Cancel superseded runs on the same ref so a new push frees the runners and
# gives faster feedback instead of queueing behind stale in-flight runs.
# (Never cancel pushes to main — only PR/branch runs.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true  # cache the uv download/build cache (keyed on uv.lock)

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --all-extras  # incl. langgraph/eval/uc/lakebase so their tests run, not skip

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v6

      - name: Guard uv.lock registry
        run: bash ../scripts/check-uv-lock-registry.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true  # cache the uv download/build cache (keyed on uv.lock)

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      # Gates new type errors. Pre-existing offenders are excluded via the
      # shrinking type-debt registry in pyproject.toml [tool.pyright].
      - name: Run pyright
        run: uv run pyright src/apx_agent/

  typecheck-ts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22']
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Guard lockfile registry
        run: bash ../scripts/check-ts-lockfile-registry.sh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
