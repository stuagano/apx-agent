name: beads issue

# Opening a GitHub issue creates its bead. Closing the issue closes that
# bead, and reopening the issue reopens it. The match is external_ref = the
# issue URL. Re-runs leave a bead that already matches.
on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  # GitHub keeps a single pending run per group. cancel-in-progress: false
  # preserves the run that already started and still cancels older pending
  # ones. That dropped the close of issue #1052 (run 45218387550) when the
  # next issue event was queued. Each event gets its own group so none are
  # dropped. bd dolt push retries if two jobs push refs/dolt/data together.
  group: beads-issue-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bd
        run: bash scripts/beads/setup_bd.sh

      - name: Sync the bead with the issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEADS_ACTOR: github-actions[bot]
        run: python3 scripts/beads/beads.py sync-issue --event "$GITHUB_EVENT_PATH" --comment
