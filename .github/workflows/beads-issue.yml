name: beads issue

# Opening a GitHub issue creates its bead. Closing the issue closes that
# bead, and reopening the issue reopens it. The match is external_ref = the
# issue URL. Re-runs leave a bead that already matches. Hive writes share
# the beads-hive queue so two jobs cannot push refs/dolt/data at once.
on:
  issues:
    types: [opened, closed, reopened]

permissions:
  contents: write
  issues: write

concurrency:
  group: beads-hive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bd
        run: bash scripts/beads/setup_bd.sh

      - name: Sync the bead with the issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEADS_ACTOR: github-actions[bot]
        run: python3 scripts/beads/beads.py sync-issue --event "$GITHUB_EVENT_PATH" --comment
