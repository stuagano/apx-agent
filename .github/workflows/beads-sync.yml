name: beads sync

# Daily backstop for the issue workflow. Import any open GitHub issue that
# has no bead yet, close a bead whose issue is already closed, and reopen a
# bead whose issue is open again. A bead that already matches is left
# unchanged, including its comments.
on:
  schedule:
    # 06:17 UTC. Minute 17 avoids the top of the hour, when scheduled
    # workflows are most often delayed. workflow_dispatch is the manual
    # backstop: the 2026-11-23 06:17 run was never created.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  # Same reason as beads issue: a shared group drops every pending run but
  # the newest, even with cancel-in-progress false.
  group: beads-sync-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bd
        run: bash scripts/beads/setup_bd.sh

      - name: List issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,title,body,url,state > "$RUNNER_TEMP/issues.json"

      - name: Reconcile beads with issue state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEADS_ACTOR: github-actions[bot]
        run: python3 scripts/beads/beads.py sync-open --issues-file "$RUNNER_TEMP/issues.json" --comment
