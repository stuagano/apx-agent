name: Release

# Push a tag matching v* (e.g. v0.18.0) to build the wheel and publish a
# GitHub Release with it attached. Install with:
#   uv pip install "apx-agent[langgraph] @ git+https://github.com/stuagano/apx-agent.git@v0.18.0#subdirectory=python"
# or download the wheel from the release page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create the release + upload the wheel as an asset

jobs:
  release:
    name: Build wheel + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      # Until hatch-vcs lands, the version is set by hand in pyproject.toml.
      # Refuse to release if the tag doesn't match it, so the release name and
      # the wheel inside it can never disagree.
      - name: Verify tag matches package version
        run: |
          PKG=$(grep -m1 '^version' python/pyproject.toml | sed -E 's/.*"(.*)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject version: $PKG   tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${PKG}. Bump python/pyproject.toml before tagging."
            exit 1
          fi

      - name: Build wheel
        run: uv build --wheel
        working-directory: python

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
