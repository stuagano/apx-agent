name: Release

# Push a tag matching v* (e.g. v0.18.0) to build the wheel and publish a
# GitHub Release with it attached. Install with:
#   uv pip install "apx-agent[langgraph] @ git+https://github.com/stuagano/apx-agent.git@v0.18.0#subdirectory=python"
# or download the wheel from the release page.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # create the release + upload the wheel as an asset

jobs:
  release:
    name: Build wheel + GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # hatch-vcs derives the version from the tag — needs full history + tags

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel
        working-directory: python

      # The version comes from the git tag via hatch-vcs, so the wheel and the
      # tag can't disagree by construction — but verify the built artifact to
      # catch a tagless/fallback build (would produce a 0.0.0 wheel).
      - name: Verify wheel version matches tag
        run: |
          WHL=$(ls python/dist/apx_agent-*.whl)
          VER=$(basename "$WHL" | sed -E 's/^apx_agent-(.+)-py3-none-any\.whl$/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          echo "wheel version: $VER   tag: $TAG"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Built wheel version ${VER} does not match tag ${TAG}. Tag a clean commit (no extra commits past the tag)."
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: python/dist/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
