bundle:
  name: agent-hub

sync:
  include:
    - .build
  exclude:
    - .venv
    - .apx
    - "**/__pycache__"
    - "**/*.pyc"
    - "*.egg-info"
    - node_modules
    - uv.lock

artifacts:
  default:
    # 1. apx build → hub wheel + frontend + requirements.txt into .build
    # 2. build the apx-agent wheel (local path dep, unpublished) into .build so
    #    the app can pip-install it on compute (no PyPI proxy there)
    # 3. stage pyproject + start.sh (start.sh installs both wheels, runs uvicorn)
    build: |
      UV_OFFLINE=1 apx build
      uv build --wheel ../python --out-dir .build
      cp pyproject.toml start.sh .build/

resources:
  apps:
    agent-hub-app:
      name: "agent-hub"
      description: "Agent Hub — portal for all deployed AI agents"
      source_code_path: ./.build
      config:
        command: ["bash", "start.sh"]

targets:
  dev:
    mode: development
    default: true
