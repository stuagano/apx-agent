# A NOT-handoff-ready bundle. Every handoff check must flag at least one thing,
# each violation naming the offending path/identifier.
bundle:
  name: sales-agent

permissions:
  - level: CAN_MANAGE
    user_name: author@databricks.com   # personal owner (AC-3)

resources:
  jobs:
    ingest:
      name: ingest
      # no timeout_seconds on job or task (AC-1)
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        pause_status: UNPAUSED           # running + no run_as owner (AC-5)
      tasks:
        - task_key: load
          notebook_task:
            notebook_path: ./load.py
            base_parameters:
              source_table: raw_orders        # bare, catalog-less (AC-4)
              target_table: sales.orders      # catalog-less (AC-4)

  sql_warehouses:
    reporting:
      name: reporting
      # no auto_stop_mins (AC-2)

  model_serving_endpoints:
    agent-llm:
      name: agent-llm
      config:
        served_entities:
          - name: agent
            # scale_to_zero_enabled missing (AC-2)

  pipelines:
    dlt:
      name: dlt
      tables:
        - orders                          # bare (AC-4)
