<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>apx-agent Visual Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Dark theme to match the rest of /_apx/* — see _ui_chat.py /
              // _ui_nav.py for the canonical palette. Was the Databricks
              // light palette previously; flipped so the builder doesn't
              // look like a different product when embedded in the unified
              // shell at /_apx/agent. Accent colors (primary, dbGreen,
              // dbBlue, dbYellow) kept unchanged — they read fine on dark.
              background: '#0a0a0a',
              surface: '#111111',
              panel: '#161616',
              border: '#2a2a2a',
              text: '#e5e7eb',
              textMuted: '#888888',
              primary: '#FF3621',
              dbTeal: '#1B3139',
              dbTealMid: '#243f49',
              dbTealLight: '#2e5060',
              dbTealBorder: '#34606f',
              dbGreen: '#00A972',
              dbBlue: '#60a5fa',
              dbYellow: '#F7A600'
            },
            fontFamily: {
              mono: ['"JetBrains Mono"', 'monospace'],
              sans: ['"Sora"', 'sans-serif']
            },
            boxShadow: {
              modern: '0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.4)',
              floating: '0 10px 15px -3px rgb(0 0 0 / 0.5), 0 4px 6px -4px rgb(0 0 0 / 0.5)'
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0a0a0a; color: #e5e7eb; overflow: hidden; font-family: 'Sora', sans-serif; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: #444; }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
      pre { white-space: pre; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
