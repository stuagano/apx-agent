[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "apx-agent"
dynamic = ["version"]
description = "Standalone agent runtime for Databricks Apps — MCP, A2A, /invocations, tool routing"
readme = "../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "databricks-openai>=0.15.0",
    # langchain 1.2.x imports ExecutionInfo from langgraph.runtime —
    # only present in langgraph >= 1.1.0.
    "langgraph>=1.1.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "databricks-langchain>=0.3.0",
]

[project.optional-dependencies]
eval = ["mlflow>=2.0"]
uc = [
    "unitycatalog-ai>=0.1.0",
]
lakebase = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
all = ["apx-agent[eval,uc,lakebase]"]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.34.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.380",
]

[project.scripts]
apx            = "apx_agent.cli:main"
voynich_seed   = "apx_agent.workflow.cli:seed_population"
voynich_run    = "apx_agent.workflow.cli:run_generation_batch"
voynich_vacuum = "apx_agent.workflow.cli:vacuum_population"
voynich_export = "apx_agent.workflow.cli:export_top_candidates"

# Version is derived from the git tag (e.g. v0.2.1 -> 0.2.1). root=".." because
# this pyproject lives in python/ but the .git root is the repo root.
[tool.hatch.version]
source = "vcs"
# fallback-version keeps shallow/tagless checkouts (e.g. CI test runs) from
# hard-failing; release.yml fetches tags and verifies the wheel version == tag.
raw-options = { root = "..", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
# packages already includes every file under src/apx_agent/ — Python modules
# AND data files (the built _static/topology/ React bundle served by _dev.py).
# Do NOT re-add a force-include for _static/topology: it maps the same files to
# the same wheel paths a second time. Older hatchling silently dedupes with a
# "Duplicate name" warning, but newer hatchling (e.g. in a fresh Databricks
# Apps container) raises a hard ValueError, failing the wheel build — and thus
# the whole git+https install. See issue #116 follow-up.
packages = ["src/apx_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyright]
include = ["src/apx_agent"]
# Everything not listed here is type-checked and gated in CI — new files and
# the ~60 already-clean modules must stay clean. The block below is a shrinking
# type-debt registry: these modules have pre-existing errors (see #85 fallout).
# Fix a module's errors, then delete its line so it's protected going forward.
exclude = [
  "src/apx_agent/_ui_*.py",
  "src/apx_agent/_dev.py",
  # --- type-debt registry (remove as fixed) ---
  "src/apx_agent/_callbacks.py",
  "src/apx_agent/_canary.py",
  "src/apx_agent/_canary_apps.py",
  "src/apx_agent/_chat_agent.py",
  "src/apx_agent/_compile.py",
  "src/apx_agent/_eval_chain.py",
  "src/apx_agent/_example_mining.py",
  "src/apx_agent/_memory_delta.py",
  "src/apx_agent/_publish.py",
  "src/apx_agent/_remote.py",
  "src/apx_agent/_topology.py",
  "src/apx_agent/_trace_export.py",
  "src/apx_agent/bootstrap.py",
  "src/apx_agent/catalog.py",
  "src/apx_agent/cli.py",
  "src/apx_agent/vector_search.py",
  "src/apx_agent/workflow/engine_delta.py",
  "src/apx_agent/workflow/loop_agent.py",
  "src/apx_agent/workflow/population_store.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.apx.agent]
name = "apx-agent"
description = "Example agent"
model = "databricks-meta-llama-3-3-70b-instruct"
