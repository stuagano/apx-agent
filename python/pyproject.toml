[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "apx-agent"
dynamic = ["version"]
description = "Standalone agent runtime for Databricks Apps — MCP, A2A, /invocations, tool routing"
readme = "../README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "databricks-openai>=0.15.0",
    # langchain 1.2.x imports ExecutionInfo from langgraph.runtime —
    # only present in langgraph >= 1.1.0.
    "langgraph>=1.1.0",
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "databricks-langchain>=0.3.0",
]

[project.optional-dependencies]
# mlflow>=3.6: search_traces uses `locations=` (the `experiment_ids` selector was
# deprecated at 3.6.0, and `experiment_names` never existed — see _mlflow_tracing).
eval = ["mlflow>=3.6"]
uc = [
    "unitycatalog-ai>=0.1.0",
]
lakebase = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
all = ["apx-agent[eval,uc,lakebase]"]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.34.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.380",
    "hatchling>=1.29.0",
    "hatch-vcs>=0.5.0",
]

[project.scripts]
apx-agent      = "apx_agent.cli:main"

# Version is derived from the git tag (e.g. v0.2.1 -> 0.2.1). root=".." because
# this pyproject lives in python/ but the .git root is the repo root.
[tool.hatch.version]
source = "vcs"
# fallback-version keeps shallow/tagless checkouts (e.g. CI test runs) from
# hard-failing; release.yml fetches tags and verifies the wheel version == tag.
raw-options = { root = "..", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
# packages already includes every file under src/apx_agent/ — Python modules
# AND data files (the built _static/topology/ React bundle served by _dev.py).
# Do NOT re-add a force-include for _static/topology: it maps the same files to
# the same wheel paths a second time. Older hatchling silently dedupes with a
# "Duplicate name" warning, but newer hatchling (e.g. in a fresh Databricks
# Apps container) raises a hard ValueError, failing the wheel build — and thus
# the whole git+https install. See issue #116 follow-up.
packages = ["src/apx_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# .ctk/ vendors the claude-test-kit helpers (library only — not packaged into the
# wheel, which ships only src/apx_agent). Makes `from ctk import run, expect,
# verify` work in the same uv env the app runs in. The fixtures + error-log guard
# are opt-in via ctk.pytest_plugin (see .ctk/README.md), so this does not change
# behaviour for the existing suite.
pythonpath = [".ctk"]
markers = [
    "unit: fast, isolated test with mocked boundaries — the inner-loop gate (pytest -m unit)",
    "allow_error_logs: do not fail the test if it logs at ERROR/CRITICAL level (ctk guard)",
]

[tool.pyright]
include = ["src/apx_agent"]
# Everything under src/apx_agent is type-checked and gated in CI. The former
# type-debt registry (pre-existing errors from #85, see #183–#188) is fully
# paid down; only the two entries below stay excluded by design:
#   _ui_*.py / _dev.py — dev-only dynamic UI glue, not worth strict typing.
# Don't re-add a module here to dodge an error — fix it or it gates CI.
exclude = [
  "src/apx_agent/_ui_*.py",
  "src/apx_agent/_dev.py",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"

[tool.apx.agent]
name = "apx-agent"
description = "Example agent"
model = "databricks-meta-llama-3-3-70b-instruct"
