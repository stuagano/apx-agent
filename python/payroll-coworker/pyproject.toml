[project]
name = "payroll-coworker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The eval extra pulls mlflow.genai for ResponsesAgent Apps hosting.
    # langgraph is a required apx-agent dependency, not an extra.
    "apx-agent[eval]",
    # mlflow.genai.agent_server (imported by agent_server/start_server.py)
    # only exists in mlflow >=3.12; an older floor lets `uv sync` succeed but
    # the deployed App 502s with ModuleNotFoundError: mlflow.genai.
    "mlflow[databricks]>=3.12",
    # Add your agent's deps here
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
# Editable local install — keeps `uv sync` working from this directory.
# At deploy time apx-agent deploy builds a wheel and rewrites .build/pyproject.toml
# to reference it (since the App container can't resolve "..").
apx-agent = { path = "..", editable = true }

[tool.apx.agent]
name = "payroll-coworker"
description = "Payroll coworker — knows employee compensation, pay runs, and workforce data."
model = "databricks-claude-sonnet-4-6"
instructions = "You are a payroll analyst who knows employee compensation, pay runs, and workforce data deeply."
# ADK-style layout: the user's agent definition lives at top-level
# ``agent.py``. ``agent_server/start_server.py`` is framework boilerplate
# that imports + wraps it for the Databricks Apps runtime.
module = "agent:agent"

# Starter prompts shown on the agent's landing page (clickable; fill the chat
# box so you can edit before sending). Tailor these to your agent's data/tools.
examples = [
    "Who are the top earners by department?",
    "Show me overtime hours by employee last pay run",
    "How many active vs terminated employees do we have?",
    "What's the total payroll cost by location?",
]

# Declare tools with Python factories in tools/ and import them in agent.py.
# Pass them to tools=[...] (or extra_tools=[...] for DataAgent).
# See docs/tools/overview.md. AgentKit's agent.toml is generated at build time.

[tool.apx.agent.memory]
type = "delta"
table_name = "serverless_stable_qh44kx_catalog.payroll_demo.apx_payroll_coworker_memory"

[tool.apx.agent.session]
type = "delta"
table_name = "serverless_stable_qh44kx_catalog.payroll_demo.apx_payroll_coworker_sessions"
