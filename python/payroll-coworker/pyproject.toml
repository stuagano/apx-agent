[project]
name = "payroll-coworker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # The eval extra pulls mlflow.genai for ResponsesAgent Apps hosting.
    # langgraph is a required apx-agent dependency, not an extra.
    "apx-agent[eval]",
    # mlflow.genai.agent_server (imported by agent_server/start_server.py)
    # only exists in mlflow >=3.12; an older floor lets `uv sync` succeed but
    # the deployed App 502s with ModuleNotFoundError: mlflow.genai.
    "mlflow[databricks]>=3.12",
    # Add your agent's deps here
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
# Editable local install — keeps `uv sync` working from this directory.
# At deploy time apx-agent deploy builds a wheel and rewrites .build/pyproject.toml
# to reference it (since the App container can't resolve "..").
apx-agent = { path = "..", editable = true }

[tool.apx.deploy]
name = "payroll-coworker"
