[project]
name = "samples-healthverity"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # [agentbricks] provides DurableAgentServer, the Apps host
    # (agent_server/start_server.py).
    "apx-agent[agentbricks]",
    # mlflow.genai (tracing) needs mlflow >=3.12. The Apps launcher does not import it.
    "mlflow[databricks]>=3.12",
    # Add your agent's deps here
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
# Editable local install — keeps `uv sync` working from this directory.
# At deploy time apx-agent agents deploy builds a wheel and rewrites .build/pyproject.toml
# to reference it (since the App container can't resolve "..").
apx-agent = { path = "..", editable = true }

[tool.apx.deploy]
name = "samples-healthverity"
