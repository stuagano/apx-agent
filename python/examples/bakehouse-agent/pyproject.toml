[project]
name = "bakehouse-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # [agentbricks] provides DurableAgentServer, the Apps host
    # (agent_server/start_server.py); [eval] keeps the local app.py runtime.
    "apx-agent[eval,agentbricks]",
    "mlflow[databricks]>=3.0",
    # Add your agent's deps here
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
# Editable local install — keeps `uv sync` working from this directory.
# At deploy time apx-agent deploy builds a wheel and rewrites .build/pyproject.toml
# to reference it (since the App container can't resolve ".."). Drop this block
# and pin "apx-agent[eval,agentbricks]==<version>" once published to PyPI.
apx-agent = { path = "../..", editable = true }

[tool.apx.metadata]
app-name = "bakehouse-agent"
app-slug = "bakehouse_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.deploy]
name = "bakehouse-agent"
