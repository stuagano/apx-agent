# Databricks Asset Bundle config for slack-agent (Apps target).
#
# Deploys the Slack bot as a Databricks App that exposes THREE surfaces:
#   /invocations  — Mosaic AI Apps shape (apps that call this as a sub-agent)
#   /slack/*      — Slack webhook surface (events, OAuth install + callback)
#   /mcp          — Genie / Genie Code MCP consumption
#
# Slack itself hits /slack/events with a slash-command payload; the router
# validates the Slack signature, exchanges the Slack user identity for the
# user's Databricks token, then invokes the agent over /invocations.

bundle:
  name: mcp-slack-agent

sync:
  include:
    - .build/**

variables:
  llm_endpoint_name:
    description: Foundation model endpoint the agent calls.
    default: databricks-claude-sonnet-4-6
  mlflow_experiment_id:
    description: MLflow experiment ID for tracing.
    default: ""

artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      # Copy source tree into .build/. pyproject.toml and uv.lock get
      # rewritten in-place below if the apx-agent wheel is present.
      # User-authored: top-level agent.py (+ optional tools.py, sub_agents/).
      cp agent.py .build/ 2>/dev/null || true
      cp tools.py .build/ 2>/dev/null || true
      cp -r sub_agents .build/ 2>/dev/null || true
      cp -r agent_server scripts src pyproject.toml uv.lock README.md .build/ 2>/dev/null || true
      # Stage the apx-agent wheel (built by `apx deploy --target apps`
      # before this script runs). When the wheel is missing, .build still
      # contains the editable source pyproject — Databricks Apps will
      # fail to install, surfacing the missing-wheel issue cleanly.
      WHEEL=$(ls apx_agent-*.whl 2>/dev/null | head -1) || true
      if [ -n "$WHEEL" ]; then
        cp "$WHEEL" .build/
        # Rewrite .build/pyproject.toml: editable parent -> wheel path.
        # No-op when the source pyproject already uses the wheel shape.
        sed -i.bak -E 's|apx-agent = \{ path = "\.\./\.\." *, editable = true *\}|apx-agent = { path = "./'"$WHEEL"'" }|g' .build/pyproject.toml
        rm -f .build/pyproject.toml.bak
        # Regenerate the lockfile against the rewritten pyproject so the
        # deployed App container's `uv sync` resolves cleanly.
        (cd .build && uv lock --quiet)
      fi


resources:
  apps:
    mcp-slack-agent:
      name: mcp-slack-agent
      description: |
        Slack bot connected to Databricks via OAuth. Validates Slack
        signatures, exchanges Slack user identity for Databricks token,
        runs tools as the calling Databricks user. Also exposes /mcp
        for Genie / Genie Code.
      source_code_path: ./.build

      resources:
        - name: llm-endpoint
          description: Foundation model endpoint used by the agent.
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY

      config:
        command:
          - uvicorn
          - agent_server.start_server:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
        env:
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value: ${var.mlflow_experiment_id}
          # Slack secrets (set via --var on deploy OR provision separately
          # via `databricks apps update mcp-slack-agent --config ...`):
          # - name: SLACK_SIGNING_SECRET
          #   value: ${var.slack_signing_secret}
          # - name: SLACK_CLIENT_ID
          #   value: ${var.slack_client_id}
          # - name: SLACK_CLIENT_SECRET
          #   value: ${var.slack_client_secret}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
