[project]
name = "slack-agent"
version = "0.1.0"
description = "Example: Slack bot using apx-agent with Databricks OAuth — illustrates OBO token forwarding"
requires-python = ">=3.11"
dependencies = [
    # The [langgraph] extra is required at runtime for compile_to_responses_agent.
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.30",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level agent.py / tools.py / webhook.py / config.py / token_store.py
# ride along as forced-includes so the wheel ships them. agent_server/ + scripts/
# are real packages.
packages = ["agent_server", "scripts"]
force-include = { "agent.py" = "agent.py", "webhook.py" = "webhook.py", "config.py" = "config.py", "token_store.py" = "token_store.py" }

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.apx.agent]
name = "slack-agent"
description = "Slack bot connected to Databricks via OAuth — illustrates OBO token forwarding"
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"

[tool.apx.deploy]
# App name MUST start with 'mcp-' for Databricks External MCP discovery.
target = "apps"
bundle_name = "mcp-slack-agent"
app_name = "mcp-slack-agent"

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
