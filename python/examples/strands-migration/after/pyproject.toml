[project]
name = "strands-support-agent"
version = "0.1.0"
description = "Worked example: a Strands agent moved from AWS AgentCore to Databricks DurableAgentServer"
requires-python = ">=3.11"
dependencies = [
    "strands-agents[openai]>=1.60",
    "databricks-agentbricks>=0.5.0",
    "databricks-sdk>=0.60",
    "mlflow>=3.5",
    "uvicorn>=0.41",
]

[project.scripts]
start-server = "runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["support_agent", "runtime"]
