[project]
name = "langgraph-rca-agent"
version = "0.1.0"
description = "Worked example: an existing LangGraph agent moved onto Databricks DurableAgentServer"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.1",
    "langchain>=1.2",
    "databricks-langchain>=0.19",
    "databricks-agentbricks[langgraph]>=0.9.0",
    "uvicorn>=0.41",
    "python-dotenv>=1.2.1",
]

[project.scripts]
start-server = "runtime.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rca", "runtime"]
