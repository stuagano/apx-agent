[project]
name = "hubspot-complaints-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # [agentbricks] provides DurableAgentServer, the Apps host
    # (agent_server/start_server.py).
    "apx-agent[agentbricks] @ git+https://github.com/stuagano/apx-agent.git@main#subdirectory=python",
    # mlflow.genai (tracing) needs mlflow >=3.12. The Apps launcher does not import it.
    "mlflow[databricks]>=3.12",
    # Add your agent's deps here
]

[project.scripts]
quickstart = "scripts.quickstart:main"
monthly-summary = "scripts.monthly_summary:main"

# [tool.uv.sources] intentionally omitted — the git+https URL in
# [project].dependencies above is the install source. Bump the @ref
# in that URL to upgrade; switch to a PyPI pin once apx-agent ships there.

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.apx.deploy]
name = "hubspot-complaints-agent"
