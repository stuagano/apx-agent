[project]
name = "customer-triage"
version = "0.1.0"
description = "apx-agent customer_triage — HandoffAgent + memory, served via Databricks Apps."
requires-python = ">=3.11"
dependencies = [
    "apx-agent[langgraph]",
    # langchain 1.2.10 (pulled transitively) imports `ExecutionInfo` from
    # langgraph.runtime which only exists in langgraph >= 1.1.0. Pin here so
    # the resolver can't land on the older line. Surfaced during the
    # fe-stable smoke deploy of HandoffAgent on 2026-05-20.
    "langgraph>=1.1.0",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.apx.agent]
name = "customer_triage"
description = "Customer support triage — classifies queries and hands off to specialists."
model = "databricks-claude-sonnet-4-6"
max_iterations = 8
# Module path to the apx-agent Agent — used by `apx-agent deploy` and friends.
# ADK-style layout: ``agent`` is exported by top-level ``agent.py``.
module = "agent:agent"

[tool.apx.deploy]
# Apps-target metadata. `apx-agent deploy --target apps` reads this block.
target = "apps"
bundle_name = "customer-triage"
app_name = "customer-triage"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]
