[project]
name = "plg-discovery"
version = "0.1.0"
description = "Nonprofit technology discovery powered by a native APX AppKit agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["apx-agent"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.apx.agent]
name = "discovery"
description = "Discover a nonprofit's current systems and recommend a governed technology blueprint"
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"

[tool.apx.deploy]
target = "apps"
bundle_name = "plg-discovery"
app_name = "plg-discovery"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
force-include = { "agent.py" = "agent.py", "data" = "data", "prompts" = "prompts", "nonprofit-saas-landscape-2025-2026.md" = "nonprofit-saas-landscape-2025-2026.md" }
