bundle:
  name: plg-discovery
sync:
  include:
  - .build
artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      rm -f .build/*.whl .build/requirements.txt
      uv build --wheel -o .build/ ../..
      uv build --wheel -o .build/
      basename .build/plg_discovery-*.whl > .build/requirements.txt
      basename .build/apx_agent-*.whl >> .build/requirements.txt
      cp agent.py app.py README.md nonprofit-saas-landscape-2025-2026.md .build/
      cp -r server data prompts .build/
      mkdir -p .build/client/dist
      cp -r client/dist/. .build/client/dist/
resources:
  apps:
    plg-discovery-app:
      name: agent-bricks-discovery
      source_code_path: ./.build
      config:
        command:
        - python
        - -m
        - app
        env:
        - name: APX_APPS_HOST
          value: agentbricks
        - name: APX_MODEL
          value: ${var.llm_endpoint_name}
        - name: MLFLOW_TRACKING_URI
          value: databricks
        - name: APX_AGENT_MLFLOW_AUTOLOG
          value: '1'
variables:
  llm_endpoint_name:
    description: Foundation model serving endpoint used by the agent
    default: databricks-claude-sonnet-4-6
targets:
  dev:
    mode: development
    default: true
    variables: {}
