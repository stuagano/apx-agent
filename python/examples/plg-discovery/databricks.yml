bundle:
  name: plg-discovery

sync:
  include:
    - .build

artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      rm -f .build/*.whl .build/requirements.txt
      uv build --wheel -o .build/ ../..
      uv build --wheel -o .build/
      basename .build/plg_discovery-*.whl > .build/requirements.txt
      basename .build/apx_agent-*.whl >> .build/requirements.txt
      mkdir -p .build/client/dist
      cp -r client/dist/. .build/client/dist/

resources:
  apps:
    plg-discovery-app:
      name: plg-discovery
      description: Nonprofit technology discovery powered by a native APX AppKit agent
      source_code_path: ./.build
      user_api_scopes:
        - serving.serving-endpoints
      resources:
        - name: experiment
          experiment:
            experiment_id: ${var.mlflow_experiment_id}
            permission: CAN_MANAGE
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: llm-endpoint
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY
      config:
        command: ["python", "-m", "agent_server.start_host"]
        env:
          - name: APX_APPS_HOST
            value: appkit
          - name: APX_APPKIT_STATIC_PATH
            value: ../client/dist
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value: ${var.mlflow_experiment_id}
          - name: MLFLOW_TRACING_SQL_WAREHOUSE_ID
            value: ${var.sql_warehouse_id}
          - name: MLFLOW_TRACING_DESTINATION
            value: ${var.catalog}.${var.schema}
          - name: APX_AGENT_MLFLOW_AUTOLOG
            value: "1"

variables:
  catalog:
    description: Unity Catalog catalog for AppKit OTLP telemetry
  schema:
    description: Unity Catalog schema for AppKit OTLP telemetry
  mlflow_experiment_id:
    description: MLflow experiment for APX and AppKit traces
  sql_warehouse_id:
    description: SQL warehouse used to query trace telemetry
  llm_endpoint_name:
    description: Foundation model serving endpoint used by the agent
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: ""
      schema: ""
      mlflow_experiment_id: ""
      sql_warehouse_id: ""
