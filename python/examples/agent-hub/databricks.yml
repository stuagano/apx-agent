bundle:
  name: agent-hub

sync:
  include:
    - .build
  exclude:
    - .venv
    - node_modules
    - "**/__pycache__"
    - "**/*.pyc"

artifacts:
  default:
    build: npm run build && uv build --wheel -o .build/ && ls -t .build/*.whl | tail -n +2 | xargs rm -f && ls -t .build/*.whl | head -1 | xargs basename > .build/requirements.txt

resources:
  apps:
    agent-hub-app:
      name: "agent-hub"
      description: "Agent Hub — portal for all deployed apx-agent apps"
      source_code_path: ./.build

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
