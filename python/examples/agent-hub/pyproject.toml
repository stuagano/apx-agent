[project]
name = "agent-hub"
version = "0.1.0"
description = "Central portal for all deployed apx-agent apps — live status, tool lists, streaming chat, and links to full dev UIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.apx.metadata]
app-name = "agent-hub"
app-slug = "agent_hub"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.ui]
ui-root = "ui"
dist-dir = "__dist__"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat shape: top-level user-facing files + the Vite-built __dist__/ shipped via forced-includes.
bypass-selection = true
force-include = { "app.py" = "app.py", "api.py" = "api.py", "models.py" = "models.py", "__dist__" = "__dist__" }
