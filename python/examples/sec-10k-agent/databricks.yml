bundle:
  name: sec-10k-agent

resources:
  apps:
    sec-10k-agent:
      name: "sec-10k-agent"
      description: "10-K research brief — SequentialAgent over a Knowledge Assistant"
      source_code_path: ./
      user_api_scopes:
        - serving.serving-endpoints
      config:
        command: ["uv", "run", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: AGENT_MODEL
            value: "databricks-meta-llama-3-3-70b-instruct"
          - name: MLFLOW_EXPERIMENT_NAME
            value: "/Shared/sec-10k-agent"
          - name: APX_KA_ENDPOINT_NAME
            value: "<your-ka-endpoint>"
      resources:
        - name: "serving-endpoint"
          serving_endpoint:
            name: "databricks-meta-llama-3-3-70b-instruct"
            permission: "CAN_QUERY"
        - name: "ka-endpoint"
          serving_endpoint:
            name: "<your-ka-endpoint>"
            permission: "CAN_QUERY"

targets:
  dev:
    mode: development
    default: true
