[project]
name = "memory-demo"
version = "0.1.0"
description = "apx-agent memory_demo — InMemory stores + ResponsesAgent + Databricks Apps."
requires-python = ">=3.11"
dependencies = [
    "apx-agent[eval]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]

[tool.apx.deploy]
target = "apps"
bundle_name = "memory-demo"
app_name = "memory-demo"
name = "memory_demo"
