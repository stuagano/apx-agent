[project]
name = "memory-demo"
version = "0.1.0"
description = "apx-agent memory_demo — InMemory stores + ResponsesAgent + Databricks Apps."
requires-python = ">=3.11"
dependencies = [
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.apx.agent]
name = "memory_demo"
description = "Travel concierge with seeded memories + few-shot examples."
model = "databricks-claude-sonnet-4-6"
# Module path to the apx-agent Agent — used by `apx-agent deploy` and friends.
# ADK-style layout: ``agent`` is exported by top-level ``agent.py``.
module = "agent:agent"

[tool.apx.deploy]
# Apps-target metadata. `apx-agent deploy --target apps` reads this block.
target = "apps"
bundle_name = "memory-demo"
app_name = "memory-demo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]
