# Databricks Asset Bundle config for precall-brief (Apps target).
#
# Deploys the pre-call brief DataAgent as a Databricks App.
#
# Deploy:
#   uv sync
#   databricks bundle deploy --profile <profile> \
#       --var "warehouse_id=<id>" \
#       --var "llm_endpoint_name=databricks-claude-sonnet-4-6"
#
# Configure:
#   Set warehouse_id and llm_endpoint_name variables below or via CLI.
#   APX_CATALOG, APX_SCHEMA, APX_WAREHOUSE_ID env vars override the defaults.

bundle:
  name: precall-brief

# Override root .gitignore which excludes **/.build/ — bundle deploy needs to
# upload .build/ (the staged source tree referenced by source_code_path).
sync:
  include:
    - .build/**

variables:
  warehouse_id:
    description: SQL warehouse ID for pre-call UC functions.
    default: ""
  llm_endpoint_name:
    description: Foundation model endpoint the agent calls.
    default: databricks-claude-sonnet-4-6
  catalog_name:
    description: UC catalog name (default: main).
    default: main
  schema_name:
    description: UC schema name (default: precall).
    default: precall

artifacts:
  default:
    build: |
      mkdir -p .build
      # User-authored: top-level agent.py + supporting modules.
      cp agent.py brief.py contract.py synthetic.py .build/ 2>/dev/null || true
      # Framework boilerplate + project files (don't edit agent_server/).
      cp -r agent_server scripts README.md .build/ 2>/dev/null || true
      cp -r sql generate precall.toml .build/ 2>/dev/null || true
      cp -r .apx .build/ 2>/dev/null || true
      cp apx_agent-*.whl .build/ 2>/dev/null || true
      # pyproject.toml and uv.lock are written by apx deploy.

resources:
  apps:
    precall-brief:
      name: precall-brief
      description: |
        apx-agent pre-call brief generator — DataAgent over 7 governed UC functions
        (one per section: orders, opportunities, win/loss, RMAs, PPRs, field notes,
        overdue actions), called per user (OBO). Returns a markdown 1-2 page brief.
      source_code_path: ./.build

      resources:
        - name: llm-endpoint
          description: Foundation model endpoint used by the agent.
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY

      config:
        command:
          - uvicorn
          - agent_server.start_server:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
        env:
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: APX_CATALOG
            value: ${var.catalog_name}
          - name: APX_SCHEMA
            value: ${var.schema_name}
          - name: APX_WAREHOUSE_ID
            value: ${var.warehouse_id}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
