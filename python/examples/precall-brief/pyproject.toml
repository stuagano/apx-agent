[project]
name = "precall-brief"
version = "0.1.0"
description = "apx-agent pre-call brief — DataAgent over governed UC functions, config-driven sections."
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { git = "https://github.com/stuagano/apx-agent.git", branch = "main", subdirectory = "python" }

[tool.apx.agent]
name = "precall_brief"
description = "Pre-call brief generator — DataAgent over 7 governed UC functions per section."
model = "databricks-claude-sonnet-4-6"
max_iterations = 8
# Module path to the apx-agent Agent — used by `apx-agent deploy` and friends.
module = "agent:agent"

[tool.apx.deploy]
# Apps-target metadata. `apx-agent deploy --target apps` reads this block.
target = "apps"
bundle_name = "precall-brief"
app_name = "precall-brief"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]
