[project]
name = "contract-parsing-agent"
version = "0.1.0"
description = "Extract structured data from contracts using GenAI — identifies pricing terms, service periods, SLAs, and regulatory clauses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "reportlab>=4.2.0",
    "pyyaml>=6.0.2",
    "mlflow>=2.18.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.pytest.ini_options]
markers = [
  "integration: requires live Databricks workspace (FM API)",
]
addopts = "-m 'not integration'"
filterwarnings = [
  "ignore:Field name \"schema\".*shadows:UserWarning",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.apx.metadata]
app-name = "contract-parsing-agent"
app-slug = "contract_parsing_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "contract_parsing_agent"
description = "Extract structured data from contracts — identifies pricing terms, service periods, SLAs, and regulatory clauses from uploaded PDF or text documents"
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"
url = ""
registry = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# tools/ is a real package.
packages = ["tools"]
force-include = { "agent.py" = "agent.py", "app.py" = "app.py", "api.py" = "api.py", "config.py" = "config.py", "extraction.py" = "extraction.py", "models.py" = "models.py", "agent.config.yaml" = "agent.config.yaml" }
