bundle:
  name: contract-parsing-agent

sync:
  include:
    - .build

artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      rm -f .build/*.whl .build/requirements.txt
      uv build --wheel -o .build/ ../databricks-tools-core
      uv build --wheel -o .build/ ../..
      uv build --wheel -o .build/
      basename .build/contract_parsing_agent-*.whl > .build/requirements.txt
      basename .build/databricks_tools_core-*.whl >> .build/requirements.txt
      basename .build/apx_agent-*.whl >> .build/requirements.txt
      mkdir -p .build/client/dist
      cp -r client/dist/. .build/client/dist/

resources:
  apps:
    contract-parsing-agent-app:
      name: "contract-parsing-agent"
      description: "contract-parsing-agent created with apx"
      source_code_path: ./.build
      config:
        command: ["python", "-m", "agent_server.start_host"]
        env:
          - name: CATALOG
            value: ${var.catalog}
          - name: SCHEMA
            value: ${var.schema}
          - name: VOLUMES_RAW
            value: ${var.volumes_raw}
          - name: VOLUMES_UPLOADS
            value: ${var.volumes_uploads}
          - name: APX_APPS_HOST
            value: appkit
          - name: APX_PYTHON_BRIDGE_APP
            value: app:app
          - name: APX_PYTHON_BRIDGE_PROXY_PATHS
            value: /api,/_apx
          - name: APX_APPKIT_STATIC_PATH
            value: ../client/dist

variables:
  catalog:
    description: Unity Catalog catalog name
  schema:
    description: Unity Catalog schema name
  volumes_raw:
    description: Full UC volume path for raw contract PDFs
  volumes_uploads:
    description: Full UC volume path for uploaded contracts

targets:
  dev:
    mode: development
    default: true
    variables:
      catalog: ""
      schema: ""
      volumes_raw: ""
      volumes_uploads: ""
