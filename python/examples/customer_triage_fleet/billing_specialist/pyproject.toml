[project]
name = "billing-specialist"
version = "0.1.0"
description = "apx-agent billing specialist — invoices, charges, refunds. Standalone A2A sub-agent."
requires-python = ">=3.11"
dependencies = [
    "apx-agent[eval]",
    "langgraph>=1.1.0",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { path = "../../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server"]

[tool.apx.deploy]
target = "apps"
bundle_name = "billing-specialist"
app_name = "billing-specialist"
name = "billing_specialist"
