[project]
name = "customer-triage-orchestrator"
version = "0.1.0"
description = "apx-agent customer triage orchestrator — classifies and routes to remote specialists over A2A."
requires-python = ">=3.11"
dependencies = [
    "apx-agent[langgraph]",
    "langgraph>=1.1.0",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { path = "../../..", editable = true }

[tool.apx.agent]
name = "customer_triage"
description = "Customer support triage — classifies queries and routes to billing, technical, or account specialists over A2A."
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"

[tool.apx.deploy]
target = "apps"
bundle_name = "customer-triage-orchestrator"
app_name = "customer-triage-orchestrator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server"]
