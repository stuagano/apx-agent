[project]
name = "account-specialist"
version = "0.1.0"
description = "apx-agent account specialist — password resets, preferences, with semantic memory. Standalone A2A sub-agent."
requires-python = ">=3.11"
dependencies = [
    "apx-agent[langgraph]",
    "langgraph>=1.1.0",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.uv.sources]
apx-agent = { path = "../../..", editable = true }

[tool.apx.agent]
name = "account_specialist"
description = "Handles account access, password resets, email changes, and user preferences. Has semantic memory."
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"

[tool.apx.deploy]
target = "apps"
bundle_name = "account-specialist"
app_name = "account-specialist"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server"]
