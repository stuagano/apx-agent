# Databricks Asset Bundle config for technical_specialist (Apps target).

bundle:
  name: technical-specialist

sync:
  include:
    - .build/**

variables:
  llm_endpoint_name:
    description: Foundation model endpoint the agent calls.
    default: databricks-claude-sonnet-4-6
  mlflow_experiment_id:
    description: MLflow experiment ID for tracing.
    default: ""

artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      cp agent.py .build/ 2>/dev/null || true
      cp app.py .build/ 2>/dev/null || true
      cp -r agent_server .build/ 2>/dev/null || true
      cp apx_agent-*.whl .build/ 2>/dev/null || true

resources:
  apps:
    technical-specialist:
      name: technical-specialist
      description: |
        apx-agent technical specialist — errors, outages, integration issues.
        Standalone A2A sub-agent for the customer triage fleet.
      source_code_path: ./.build

      resources:
        - name: llm-endpoint
          description: Foundation model endpoint used by the agent.
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY

      config:
        command:
          - uvicorn
          - agent_server.start_server:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
        env:
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: APX_SMOKE_MODE
            value: "1"
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value: ${var.mlflow_experiment_id}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
