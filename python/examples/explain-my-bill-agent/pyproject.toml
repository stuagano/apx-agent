[project]
name = "explain-my-bill-agent"
version = "0.1.0"
description = "Energy billing Q&A agent — answers questions about AMI readings, billing history, and rate plans via Unity Catalog"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "mlflow>=3.6.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.apx.metadata]
app-name = "explain-my-bill-agent"
app-slug = "explain_my_bill_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "explain_my_bill_agent"
description = "Answer customer energy billing questions — looks up account profiles, AMI smart meter readings, billing history, rate schedules, and compares usage across months"
model = "databricks-meta-llama-3-3-70b-instruct"
module = "agent:agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat shape: top-level modules shipped via forced-includes.
bypass-selection = true
force-include = { "agent.py" = "agent.py", "app.py" = "app.py", "tools.py" = "tools.py" }
