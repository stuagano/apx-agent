[project]
name = "data-triage-agent"
version = "0.1.0"
description = "Investigate why data is missing from Databricks tables — traces lineage, checks job failures, and inspects source code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # [agentbricks] provides the native DurableAgentServer runtime.
    # langgraph is a required apx-agent dependency, not an extra.
    "apx-agent[eval,agentbricks]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.81.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
    "sqlfluff>=3.0.0",
    "plutoprint==0.19.0",
    "databricks-tools-core",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }
databricks-tools-core = { path = "./databricks_tools_core-0.1.0-py3-none-any.whl" }

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.apx.metadata]
app-name = "data-triage-agent"
app-slug = "data_triage_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "data_triage_agent"
description = "Investigate why data is missing from Databricks tables or APIs — traces lineage, checks job failures, and inspects source code"
model = "system.ai.claude-sonnet-4-6"
module = "agent:agent"
target = "durable_agent_server"
registered_model = "serverless_stable_7def3z_catalog.apx.mcp_data_triage_agent"

# No managed session store: the agent is a KeywordRouter (not an LlmAgent, which
# a managed store currently requires) and the investigation pipeline is
# stateless per request. Durable provides native /invocations with invocation
# events persisted in the runtime store; request-user invocations are not
# recovered in the background (no background recovery).

[tool.apx.agent.deploy]
# Apps API keeps the mcp- app name (External MCP discovery) on a dedicated App;
# the Agent Bricks backend requires an agent-bricks- name.
backend = "apps_api"
entrypoint = "app"
include = ["app.py", "api.py", "prompts.py", "integrations", "databricks_tools_core-0.1.0-py3-none-any.whl"]
# DATA_INSPECTOR_URL (the data-inspector App's URL) is workspace-specific:
# pass it at deploy time with --env DATA_INSPECTOR_URL=https://<app-url>.

[tool.apx.deploy]
target = "apps"
# App name MUST start with 'mcp-' for Databricks External MCP discovery to
# pick up /mcp on the deployed Apps URL.
bundle_name = "mcp-data-triage-agent"
app_name = "mcp-data-triage-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# scripts/ is a real package. integrations/ holds opt-in integrations
# (Jira, etc.) — see integrations/jira/README.md.
packages = ["scripts", "integrations"]
force-include = { "agent.py" = "agent.py", "tools.py" = "tools.py", "app.py" = "app.py", "api.py" = "api.py" }

[tool.pytest.ini_options]
testpaths = ["tests", "integrations/jira/tests"]
pythonpath = ["."]
