[project]
name = "data-triage-agent"
version = "0.1.0"
description = "Investigate why data is missing from Databricks tables — traces lineage, checks job failures, and inspects source code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The [langgraph] extra is required at runtime for compile_to_responses_agent
    # (Apps deploy path) — it pulls in langchain + langgraph + databricks-langchain.
    # Same dep also covers the Model Serving compile_to_chat_agent path.
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[project.scripts]
investigate = "data_triage_agent.jobs.investigate:main"
quickstart = "scripts.quickstart:main"

[tool.apx.metadata]
app-name = "data-triage-agent"
app-slug = "data_triage_agent"
app-entrypoint = "data_triage_agent.backend.app:app"
api-prefix = "/api"
metadata-path = "src/data_triage_agent/_metadata.py"

[tool.apx.agent]
name = "data_triage_agent"
description = "Investigate why data is missing from Databricks tables or APIs — traces lineage, checks job failures, and inspects source code"
model = "databricks-claude-sonnet-4-6"
module = "data_triage_agent.backend.pipeline:agent"
url = ""
registry = ""

[tool.apx.deploy]
target = "apps"
bundle_name = "data-triage-agent"
app_name = "data-triage-agent"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Includes the existing src/ package + the Apps-target agent_server/ and
# scripts/ packages so `databricks bundle deploy` stages them together.
packages = ["src/data_triage_agent", "agent_server", "scripts"]
