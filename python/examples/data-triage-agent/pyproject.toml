[project]
name = "data-triage-agent"
version = "0.1.0"
description = "Investigate why data is missing from Databricks tables — traces lineage, checks job failures, and inspects source code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The [langgraph] extra is required at runtime for compile_to_responses_agent
    # (Apps deploy path) — it pulls in langchain + langgraph + databricks-langchain.
    # Same dep also covers the Model Serving compile_to_chat_agent path.
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.81.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
    "sqlfluff>=3.0.0",
    "plutoprint==0.19.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }
databricks-tools-core = { path = "./databricks_tools_core-0.1.0-py3-none-any.whl" }

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.apx.metadata]
app-name = "data-triage-agent"
app-slug = "data_triage_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "data_triage_agent"
description = "Investigate why data is missing from Databricks tables or APIs — traces lineage, checks job failures, and inspects source code"
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"
url = ""
registry = ""
registered_model = "serverless_stable_7def3z_catalog.apx.mcp_data_triage_agent"

[tool.apx.deploy]
target = "apps"
# App name MUST start with 'mcp-' for Databricks External MCP discovery to
# pick up /mcp on the deployed Apps URL.
bundle_name = "mcp-data-triage-agent"
app_name = "mcp-data-triage-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# agent_server/ + scripts/ are real packages. integrations/ holds opt-in
# integrations (Jira, etc.) — see integrations/jira/README.md.
packages = ["agent_server", "scripts", "integrations"]
force-include = { "agent.py" = "agent.py", "tools.py" = "tools.py", "app.py" = "app.py", "api.py" = "api.py" }

[tool.pytest.ini_options]
testpaths = ["tests", "integrations/jira/tests"]
pythonpath = ["."]
