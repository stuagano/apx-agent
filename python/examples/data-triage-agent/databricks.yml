bundle:
  name: data-triage-agent

sync:
  include:
    - .build

artifacts:
  default:
    build: uv build --wheel -o .build/ && ls .build/*.whl | xargs basename > .build/requirements.txt

resources:
  apps:
    mcp-data-triage-app:
      name: "mcp-data-triage"
      description: "Data triage agent — investigates missing data (MCP-enabled for Genie Code)"
      source_code_path: ./.build
      config:
        env_variables:
          - name: DATA_INSPECTOR_URL
            value: ${var.data_inspector_url}
          - name: JIRA_WEBHOOK_SECRET
            value: ${var.jira_webhook_secret}
          - name: DATA_TRIAGE_JOB_ID
            value: ${var.data_triage_job_id}

  jobs:
    data-triage-investigation:
      name: "data-triage-investigation"
      tasks:
        - task_key: investigate
          environment_key: default
          python_wheel_task:
            package_name: data_triage_agent
            entry_point: investigate
      environments:
        - environment_key: default
          spec:
            client: "1"
            dependencies:
              - ${workspace.file_path}/.build/data_triage_agent-latest.whl

variables:
  data_inspector_url:
    description: URL of the companion data-inspector MCP app
  jira_base_url:
    description: "Jira workspace URL, e.g. https://your-org.atlassian.net"
    default: ""
  jira_service_account_email:
    description: Service account email for Jira API auth
    default: ""
  jira_api_token:
    description: Jira API token for the service account
    default: ""
  jira_webhook_secret:
    description: HMAC-SHA256 secret shared with Jira webhook (generate with openssl rand -hex 32)
    default: ""
  data_triage_job_id:
    description: "Databricks Job ID for the investigation job (set after first bundle deploy)"
    default: "0"

targets:
  dev:
    mode: development
    default: true
    variables:
      data_inspector_url: ""
