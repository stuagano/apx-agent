# Databricks Asset Bundle config for data-triage-agent (Apps target).
#
# Deploys the 6-step SequentialAgent investigation pipeline as a Databricks
# App. Requires a deployed data-inspector sub-agent at $DATA_INSPECTOR_URL
# (see ../data-inspector/).
#
# Deploy:
#   uv sync
#   uv run quickstart
#   apx deploy --target apps          # or: databricks bundle deploy + bundle run

bundle:
  name: mcp-data-triage-agent

# Root .gitignore excludes ``**/.build/`` — bundle deploy needs to upload
# .build/ (the staged source tree referenced by source_code_path).
sync:
  include:
    - .build/**

variables:
  llm_endpoint_name:
    description: Foundation model endpoint the agent calls.
    default: databricks-claude-sonnet-4-6
  mlflow_experiment_id:
    description: |
      MLflow experiment ID for tracing. Populated by scripts/quickstart.py
      into a local .env file and surfaced here for the app environment.
    default: ""
  data_inspector_url:
    description: |
      Base URL of the deployed data-inspector sub-agent (A2A). The
      investigation pipeline delegates SQL + Delta forensics to it. Set
      to the data-inspector's Apps URL or Model Serving endpoint URL.
    default: ""

artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      # User-authored: top-level agent.py + tools.py + app.py + helpers.
      cp agent.py .build/ 2>/dev/null || true
      cp tools.py .build/ 2>/dev/null || true
      cp app.py .build/ 2>/dev/null || true
      cp api.py .build/ 2>/dev/null || true
      cp webhook.py .build/ 2>/dev/null || true
      cp config.py .build/ 2>/dev/null || true
      cp jira_client.py .build/ 2>/dev/null || true
      cp -r jobs .build/ 2>/dev/null || true
      cp -r sub_agents .build/ 2>/dev/null || true
      # Framework boilerplate + project files (don't edit agent_server/).
      cp -r agent_server scripts pyproject.toml uv.lock README.md .build/ 2>/dev/null || true
      # Stage the apx-agent wheel + rewrite editable -> wheel path.
      WHEEL=$(ls apx_agent-*.whl 2>/dev/null | head -1) || true
      if [ -n "$WHEEL" ]; then
        cp "$WHEEL" .build/
        sed -i.bak -E 's|apx-agent = \{ path = "\.\./\.\." *, editable = true *\}|apx-agent = { path = "./'"$WHEEL"'" }|g' .build/pyproject.toml
        rm -f .build/pyproject.toml.bak
        (cd .build && uv lock --quiet)
      fi

resources:
  apps:
    mcp-data-triage-agent:
      name: mcp-data-triage-agent
      description: |
        apx-agent data-triage-agent — 6-step SequentialAgent investigation
        pipeline (presence -> lineage -> pipeline -> genie -> code -> synthesis).
        Delegates SQL + Delta forensics to a data-inspector sub-agent via A2A.
      source_code_path: ./.build

      resources:
        - name: llm-endpoint
          description: Foundation model endpoint used by the agent.
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY

      config:
        command:
          - uvicorn
          - agent_server.start_server:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
        env:
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value: ${var.mlflow_experiment_id}
          - name: DATA_INSPECTOR_URL
            value: ${var.data_inspector_url}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
