[project]
name = "apx-builder"
version = "0.1.0"
description = "Natural language agent builder — describe your agent and I'll build and deploy it"
requires-python = ">=3.11"
dependencies = [
    "apx-agent>=0.16.0",
    "fastapi>=0.119.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["apx_builder"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"

[tool.apx.metadata]
app-name = "apx-builder"
app-entrypoint = "app:app"

[tool.apx.agent]
name = "apx_builder"
description = "Natural language agent builder — describe your agent and I'll build and deploy it"
model = "databricks-claude-sonnet-4-6"
url = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
