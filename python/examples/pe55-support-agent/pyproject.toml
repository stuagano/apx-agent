[project]
name = "pe55-support-agent"
version = "0.1.0"
description = "PE55 Brickfood support agent — reviews + product docs + latest policy, OBO by default"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "mlflow>=3.6.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.apx.metadata]
app-name = "pe55-support-agent"
app-slug = "pe55_support_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "pe55_support_agent"
description = "Customer-support agent: latest policy + reviews SQL + product-docs search, as the caller"
model = "databricks-meta-llama-3-3-70b-instruct"
module = "agent:agent"

# Stretch (PE55 Task 5): swap the in-memory session for Lakebase. Not wired
# here — this is a store swap, not a new agent.
# [tool.apx.agent.session]
# type = "lakebase"
# host = "${LAKEBASE_HOST}"
# database = "pe55_support"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
force-include = { "agent.py" = "agent.py", "app.py" = "app.py" }
