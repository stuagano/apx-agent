[project]
name = "afr-enrollment-api"
version = "0.1.0"
description = "Deterministic AFR enrollment pipeline — calls account-search-service, evaluates candidates, logs decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "databricks-sdk>=0.20.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.23.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.hatch.build.targets.wheel]
# Flat shape: top-level modules shipped via forced-includes.
bypass-selection = true
force-include = { "app.py" = "app.py", "api.py" = "api.py", "models.py" = "models.py", "evaluator.py" = "evaluator.py", "search_client.py" = "search_client.py", "demo_data.py" = "demo_data.py" }

[tool.apx.app]
name = "afr-enrollment-api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
