[project]
name = "afr-enrollment-api"
version = "0.1.0"
description = "Deterministic AFR enrollment pipeline — calls account-search-service, evaluates candidates, logs decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent @ git+https://github.com/stuagano/apx-agent.git@15921c9",
    "databricks-sdk>=0.20.0",
    "fastapi>=0.100.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afr_enrollment_api"]

[tool.apx.app]
name = "afr-enrollment-api"

[tool.pytest.ini_options]
testpaths = ["tests"]
