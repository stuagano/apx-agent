[project]
name = "eligibility-agent"
version = "0.1.0"
description = "Document-based eligibility assessment agent — verifies income, residency, and criteria from uploaded PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "databricks-sdk>=0.30",
    "pdf2image>=1.17",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.11.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# tools/ is a real package.
packages = ["tools"]
force-include = { "agent.py" = "agent.py", "app.py" = "app.py", "prompts.py" = "prompts.py", "config.py" = "config.py" }

[tool.apx.agent]
name = "eligibility-agent"
description = "Assess program eligibility from application documents — income, residency, and criteria verification."
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"
max_iterations = 8

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
