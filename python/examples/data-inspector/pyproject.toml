[project]
name = "data-inspector"
version = "0.1.0"
description = "Delta table forensics — binary search versions, diff changes, audit history, and SQL queries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The [langgraph] extra is required at runtime for both deploy targets:
    # compile_to_chat_agent (Model Serving) and compile_to_responses_agent
    # (Apps) both import langchain_core via the langgraph compiler.
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.81.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "sqlglot>=20.0.0",
    "sqlfluff>=3.0.0",
    "plutoprint==0.19.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }
databricks-tools-core = { path = "./databricks_tools_core-0.1.0-py3-none-any.whl" }

[tool.apx.metadata]
app-name = "data-inspector"
app-slug = "data_inspector"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "data_inspector"
description = "Inspect and forensically analyze Delta tables — check data presence, binary search version history, diff versions, and audit who changed what"
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"
profile = "fe-stable"
url = ""
registry = ""

[tool.apx.deploy]
# App name MUST start with 'mcp-' for Databricks External MCP discovery.
target = "apps"
bundle_name = "mcp-data-inspector"
app_name = "mcp-data-inspector"

[project.scripts]
quickstart = "scripts.quickstart:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# agent_server/ + scripts/ are real packages.
packages = ["agent_server", "scripts"]
force-include = { "agent.py" = "agent.py", "tools.py" = "tools.py", "app.py" = "app.py" }
