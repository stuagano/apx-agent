# Databricks Asset Bundle config for data-inspector (Apps target).
#
# Exposes Delta forensics + UC discovery as a Databricks App that
# data-triage-agent (and other consumers) delegate to via A2A and Genie
# can consume via /mcp.

bundle:
  name: mcp-data-inspector

sync:
  include:
    - .build/**

variables:
  llm_endpoint_name:
    description: Foundation model endpoint the agent calls.
    default: databricks-claude-sonnet-4-6
  mlflow_experiment_id:
    description: MLflow experiment ID for tracing.
    default: ""

artifacts:
  default:
    build: |
      set -e
      mkdir -p .build
      # User-authored: top-level agent.py + tools.py + app.py (+ optional sub_agents/).
      cp agent.py .build/ 2>/dev/null || true
      cp tools.py .build/ 2>/dev/null || true
      cp app.py .build/ 2>/dev/null || true
      cp -r sub_agents .build/ 2>/dev/null || true
      # Framework boilerplate + project files (don't edit agent_server/).
      cp -r agent_server scripts README.md .build/ 2>/dev/null || true
      cp apx_agent-*.whl .build/ 2>/dev/null || true
      # pyproject.toml and uv.lock are written by apx deploy (wheel-pinned +
      # sanitized to public PyPI). Do NOT copy or re-`uv lock` them here:
      # bundle deploy re-runs this script AFTER apx's sanitize, and a local
      # `uv lock` re-poisons the lock with UV_INDEX_URL's internal pypi-proxy,
      # which the App container can't reach. See bakehouse-agent.


resources:
  apps:
    mcp-data-inspector:
      name: mcp-data-inspector
      description: |
        Delta table forensics + UC discovery — list catalogs/schemas/tables,
        sample/count/describe, version diffs, audit history. A2A sub-agent for
        data-triage-agent; /mcp surface for Genie / Genie Code.
      source_code_path: ./.build

      # OBO scopes the forwarded-user token carries. The Delta forensics tools
      # call the SQL warehouses + statement-execution APIs, so `sql` is required
      # — without it those calls 403 ("Invalid scope, required: sql"). The UC
      # discovery tools (list_catalogs/schemas/tables, search_tables,
      # get_table_info) call the Unity Catalog REST API, which needs
      # `unity-catalog` — without it they 403 ("required scopes: unity-catalog").
      # Prod-only: local dev uses the developer's full-scope CLI profile, so the
      # gap only surfaces once deployed with a scope-limited OBO token (#563).
      user_api_scopes:
        - sql
        - unity-catalog
        - serving.serving-endpoints

      resources:
        - name: llm-endpoint
          description: Foundation model endpoint used by the agent.
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY

      config:
        command:
          - uvicorn
          - agent_server.start_server:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
        env:
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value: ${var.mlflow_experiment_id}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
