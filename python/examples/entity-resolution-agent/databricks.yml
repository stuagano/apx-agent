bundle:
  name: entity-resolution-agent

sync:
  include:
    - .build

artifacts:
  default:
    build: >-
      uv build --wheel -o .build/ &&
      ls .build/*.whl | xargs basename > .build/requirements.txt

resources:
  apps:
    entity-resolution-agent-app:
      name: "entity-resolution-agent"
      description: "Fuzzy-match and resolve customer/account entities using Vector Search + SQL fallback"
      source_code_path: ./.build

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
