# Databricks Asset Bundle config for entity-resolution-agent (Apps target).
#
# Deploys the HandoffAgent (Supervisor + Evaluator) as a Databricks App.
# Vector Search index lookup runs as user-scoped OBO via the calling user's
# X-Forwarded-Access-Token; the user's UC grants on the index govern access.

bundle:
  name: mcp-entity-resolution-agent

# Root .gitignore excludes **/.build/ — bundle deploy needs to upload .build/
sync:
  include:
    - .build/**

variables:
  llm_endpoint_name:
    description: Foundation model endpoint the agent calls.
    default: databricks-claude-sonnet-4-6
  mlflow_experiment_id:
    description: MLflow experiment ID for tracing.
    default: ""
  # vector_search_index / vector_search_endpoint vars are intentionally
  # omitted — Databricks Apps rejects env entries whose value resolves to
  # the empty string. When you wire Vector Search, declare them here AND
  # uncomment the matching env entries below, then deploy with
  # `apx deploy --target apps --var vector_search_index=... --var ...`.

artifacts:
  default:
    build: |
      mkdir -p .build
      set -e
      mkdir -p .build
      # User-authored: top-level agent.py + tools.py + sub_agents/ + helpers.
      cp agent.py .build/ 2>/dev/null || true
      cp tools.py .build/ 2>/dev/null || true
      cp app.py .build/ 2>/dev/null || true
      cp api.py .build/ 2>/dev/null || true
      cp demo_data.py .build/ 2>/dev/null || true
      cp -r sub_agents .build/ 2>/dev/null || true
      cp -r agent_server scripts pyproject.toml uv.lock README.md .build/ 2>/dev/null || true
      # Stage the apx-agent wheel (built by `apx deploy --target apps` before
      # this script runs). When the wheel is missing, .build still contains
      # the editable source pyproject — Databricks Apps will fail to install,
      # surfacing the missing-wheel issue cleanly.
      WHEEL=$(ls apx_agent-*.whl 2>/dev/null | head -1) || true
      if [ -n "$WHEEL" ]; then
        cp "$WHEEL" .build/
        # Rewrite .build/pyproject.toml: editable parent -> wheel path.
        sed -i.bak -E 's|apx-agent = \{ path = "\.\./\.\." *, editable = true *\}|apx-agent = { path = "./'"$WHEEL"'" }|g' .build/pyproject.toml
        rm -f .build/pyproject.toml.bak
        (cd .build && uv lock --quiet)
      fi

resources:
  apps:
    mcp-entity-resolution-agent:
      name: mcp-entity-resolution-agent
      description: |
        Fuzzy name+address matching via Vector Search + HandoffAgent
        (Supervisor + Evaluator). /mcp exposed for Genie / Genie Code.
      source_code_path: ./.build

      resources:
        - name: llm-endpoint
          description: Foundation model endpoint used by the agent.
          serving_endpoint:
            name: ${var.llm_endpoint_name}
            permission: CAN_QUERY

      config:
        command:
          - uvicorn
          - agent_server.start_server:app
          - --host
          - 0.0.0.0
          - --port
          - $DATABRICKS_APP_PORT
        env:
          - name: APX_MODEL
            value: ${var.llm_endpoint_name}
          - name: MLFLOW_TRACKING_URI
            value: databricks
          - name: MLFLOW_EXPERIMENT_ID
            value: ${var.mlflow_experiment_id}
          # - name: VECTOR_SEARCH_INDEX
          #   value: ${var.vector_search_index}
          # - name: VECTOR_SEARCH_ENDPOINT
          #   value: ${var.vector_search_endpoint}

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
