[project]
name = "entity-resolution-agent"
version = "0.1.0"
description = "Entity resolution agent — fuzzy name+address matching via Databricks Vector Search, with Supervisor/Evaluator HandoffAgent for confidence-scored decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The [langgraph] extra is required at runtime for both deploy targets:
    # compile_to_chat_agent (Model Serving) and compile_to_responses_agent
    # (Apps) both import langchain_core via the langgraph compiler.
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
# Editable parent path keeps `uv sync` working on first checkout. At deploy
# time, the apx-agent wheel is built + the artifacts script in databricks.yml
# rewrites .build/pyproject.toml to point at the wheel.
apx-agent = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.apx.metadata]
app-name = "entity-resolution-agent"
app-slug = "entity_resolution_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "entity_resolution_agent"
description = "Resolve and deduplicate customer/account entities across utility data systems — fuzzy-matches records, identifies duplicates, and links accounts to canonical identities"
model = "databricks-claude-sonnet-4-6"
module = "agent:agent"
url = "$ENTITY_RESOLUTION_AGENT_URL"
registry = "$AGENT_HUB_URL"

[tool.apx.deploy]
# App name MUST start with 'mcp-' for Databricks External MCP discovery.
target = "apps"
bundle_name = "mcp-entity-resolution-agent"
app_name = "mcp-entity-resolution-agent"

[project.scripts]
quickstart = "scripts.quickstart:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# agent_server/ + scripts/ are real packages.
packages = ["agent_server", "scripts"]
force-include = { "agent.py" = "agent.py", "app.py" = "app.py", "api.py" = "api.py", "demo_data.py" = "demo_data.py", "sub_agents" = "sub_agents" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
