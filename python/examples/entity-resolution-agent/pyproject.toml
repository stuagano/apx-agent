[project]
name = "entity-resolution-agent"
dynamic = ["version"]
description = "Entity resolution agent — fuzzy name+address matching via Databricks Vector Search, with Supervisor/Evaluator HandoffAgent for confidence-scored decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # The [langgraph] extra is required at runtime for both deploy targets:
    # compile_to_chat_agent (Model Serving) and compile_to_responses_agent
    # (Apps) both import langchain_core via the langgraph compiler.
    "apx-agent[langgraph]",
    "mlflow[databricks]>=3.0.0",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
# In-source-code-tree wheel — bundled into .build/ at deploy time so the App
# container can resolve it without reaching outside source_code_path. Mirrors
# memory_demo / customer_triage / data-triage-agent. Swap to editable for
# local dev only: apx-agent = { path = "../..", editable = true }.
apx-agent = { path = "./apx_agent-0.18.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.apx.metadata]
app-name = "entity-resolution-agent"
app-slug = "entity_resolution_agent"
app-entrypoint = "entity_resolution_agent.backend.app:app"
api-prefix = "/api"
metadata-path = "src/entity_resolution_agent/_metadata.py"

[tool.apx.agent]
name = "entity_resolution_agent"
description = "Resolve and deduplicate customer/account entities across utility data systems — fuzzy-matches records, identifies duplicates, and links accounts to canonical identities"
model = "databricks-claude-sonnet-4-6"
module = "entity_resolution_agent.backend.agent_router:agent"
url = "$ENTITY_RESOLUTION_AGENT_URL"
registry = "$AGENT_HUB_URL"

[tool.apx.deploy]
# App name MUST start with 'mcp-' for Databricks External MCP discovery.
target = "apps"
bundle_name = "mcp-entity-resolution-agent"
app_name = "mcp-entity-resolution-agent"

[project.scripts]
quickstart = "scripts.quickstart:main"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/entity_resolution_agent/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/entity_resolution_agent/__dist__", "src/entity_resolution_agent/_metadata.py"]

[tool.hatch.build.targets.wheel]
# Includes the existing src/ package + the Apps-target agent_server/ and
# scripts/ packages so `databricks bundle deploy` stages them together.
packages = ["src/entity_resolution_agent", "agent_server", "scripts"]
