[project]
name = "shortage-intelligence-agent"
version = "0.1.0"
description = "Autonomous shortage intelligence — scans demand clusters, validates against market data, checks vendor availability, and delivers dual reports to sourcing and sales teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent[lakebase]",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "databricks-langchain>=0.19.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[project.scripts]
morning-scan = "jobs.morning_scan:main"

[tool.apx.metadata]
app-name = "shortage-intelligence-agent"
app-slug = "shortage_intelligence_agent"
app-entrypoint = "app:app"
api-prefix = "/api"

[tool.apx.agent]
name = "shortage_intelligence_agent"
description = "Detects shortage signals in demand data, validates against market reports, checks live vendor pricing, and delivers actionable reports to sourcing and sales teams"
model = "databricks-claude-opus-4-7"
module = "agent:agent"
url = ""
registry = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ADK shape: top-level user-facing files ride along as forced-includes.
# jobs/ is a real package.
packages = ["jobs"]
force-include = { "agent.py" = "agent.py", "tools.py" = "tools.py", "app.py" = "app.py", "api.py" = "api.py", "config.py" = "config.py", "models.py" = "models.py", "uc_helpers.py" = "uc_helpers.py" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
