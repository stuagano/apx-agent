[project]
name = "shortage-intelligence-agent"
version = "0.1.0"
description = "Autonomous shortage intelligence — scans demand clusters, validates against market data, checks vendor availability, and delivers dual reports to sourcing and sales teams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
    "databricks-langchain>=0.19.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ty>=0.0.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[project.scripts]
morning-scan = "shortage_intelligence_agent.jobs.morning_scan:main"

[tool.apx.metadata]
app-name = "shortage-intelligence-agent"
app-slug = "shortage_intelligence_agent"
app-entrypoint = "shortage_intelligence_agent.backend.app:app"
api-prefix = "/api"
metadata-path = "src/shortage_intelligence_agent/_metadata.py"

[tool.apx.agent]
name = "shortage_intelligence_agent"
description = "Detects shortage signals in demand data, validates against market reports, checks live vendor pricing, and delivers actionable reports to sourcing and sales teams"
model = "databricks-claude-opus-4-7"
url = ""
registry = ""

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shortage_intelligence_agent"]
