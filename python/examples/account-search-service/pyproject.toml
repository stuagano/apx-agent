[project]
name = "account-search-service"
version = "0.1.0"
description = "Standalone account search service — VS fan-out + SQL fallback for entity resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent @ git+https://github.com/stuagano/apx-agent.git@15921c9",
    "databricks-sdk>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/account_search_service"]

[tool.apx.app]
name = "account-search-service"

[tool.pytest.ini_options]
testpaths = ["tests"]
