[project]
name = "account-search-service"
version = "0.1.0"
description = "Standalone account search service — VS fan-out + SQL fallback for entity resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apx-agent",
    "databricks-sdk>=0.20.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
]

[tool.uv.sources]
apx-agent = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat shape: top-level user-facing files ride along as forced-includes.
# No top-level package — wheel ships individual modules.
bypass-selection = true
force-include = { "app.py" = "app.py", "api.py" = "api.py", "models.py" = "models.py", "search.py" = "search.py", "demo_data.py" = "demo_data.py" }

[tool.apx.app]
name = "account-search-service"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
